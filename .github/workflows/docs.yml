name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/releases/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm and Node 22
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - name: Install
        run: pnpm install --frozen-lockfile --filter website
      - name: Build
        run: pnpm --filter website run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
