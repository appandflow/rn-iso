# SLOW, GATED native e2e -- a real xcodebuild / gradle build on a real
# simulator/emulator, across the full 2x2 matrix:
#
#     framework in {bare, expo}   x   platform in {ios, android}
#
# TWO SUITES RUN ON THIS MATRIX, selected by the `suite` dispatch input:
#   loop    test/e2e/native/run-native-e2e.mjs -- docs/field-test-protocol.md as
#           code: create -> start -> build -> second worktree hits the cache ->
#           teardown. THE DEFAULT, and what the nightly has always run.
#   caches  test/e2e/native/run-cache-e2e.mjs -- for every cache stim-cli supplies,
#           prove it is ENGAGED (read off the real argv/log), that it STORES (the
#           directory gained files), and that a second workspace REUSED it. It
#           costs two extra cold compiles per variant, so it is ON DEMAND ONLY:
#           run it before a release, or after a change that touches caching.
#   all     both, as separate parallel matrix jobs.
#
# The nightly and the PR label keep running `loop` exactly as before -- adding
# the input changed nothing about them.
#
# WHY IT IS GATED. A cold native build is ~10-20 minutes and occasionally flaky
# (device boot, toolchain). Blocking every PR on it would be miserable, so it
# runs:
#   - nightly (schedule), against main;
#   - on demand (workflow_dispatch);
#   - on a PR ONLY when that PR carries the `e2e-native` label (see the `if:`
#     guard on each job). Adding the label re-triggers via the `labeled` event.
#
# VARIANT LAYOUT. Each platform is its own job. Framework and selected suite are
# matrix axes. An `all` dispatch runs four isolated jobs per platform. Other
# events run the two framework variants for one suite. iOS and Android are
# separate jobs because iOS needs macOS and Xcode, while Android needs Linux and
# KVM. Bare and Expo exercise different stim-cli Metro paths.
name: Native E2E

on:
  schedule:
    # 07:00 UTC nightly. Cron has no notion of "against main" -- schedule always
    # runs on the default branch, which is what we want.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run on the 2x2 matrix'
        type: choice
        default: loop
        options: [loop, caches, all]
  pull_request:
    # `labeled` is what makes "add the label to run it" work; the others let a
    # push to an already-labeled PR re-run. The `if:` on each job is the actual
    # gate -- these types only decide when to EVALUATE it.
    types: [labeled, opened, synchronize, reopened]

concurrency:
  group: e2e-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: ios ${{ matrix.framework }} (${{ matrix.suite }})
    # Gate: always on schedule/dispatch; on a PR only when it is labeled.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e-native'))
    runs-on: macos-latest
    # The caches suite adds a second cold compile (the single-flight race) plus a
    # third cache-hit build, so it needs headroom the loop suite never did.
    timeout-minutes: ${{ matrix.suite == 'caches' && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        framework: [bare, expo]
        # Schedule and pull_request events have no suite input and use loop.
        suite: ${{ fromJSON(inputs.suite == 'all' && '["loop","caches"]' || inputs.suite == 'caches' && '["caches"]' || '["loop"]') }}
    env:
      STIM_E2E_SUITE: ${{ matrix.suite }}
      # The registry stays throwaway per run (the driver makes its own temp home)
      # for deterministic device/project state; the SHARED build cache is
      # persisted across runs here, so the cross-run cache path is itself
      # exercised. Kept per-variant so bare and expo never address one another's
      # entries.
      STIM_BUILD_CACHE: ${{ github.workspace }}/.e2e-build-cache/ios-${{ matrix.framework }}
      # Keep the throwaway STIM_HOME under the workspace so the failure
      # artifact step can find global workspace logs.
      TMPDIR: ${{ github.workspace }}/.e2e-tmp
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$TMPDIR" "$STIM_BUILD_CACHE"

      - name: Set up pnpm and Node 22
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Set up Ruby and Bundler for the fixture's Gemfile
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Select a recent stable Xcode
        # REVIEWER: confirm the macos-latest image ships this Xcode. 'latest-stable'
        # tracks whatever the runner image has; pin to a specific version here if a
        # build needs a known toolchain.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install (workspace root)
        run: pnpm install --frozen-lockfile

      - name: Build (dist/cli.mjs is what the native e2e drives)
        run: pnpm run build

      - name: Restore cross-run build cache
        if: matrix.suite == 'loop'
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STIM_BUILD_CACHE }}
          # Invalidated when the lockfile changes (a dep bump can move the
          # fingerprint); restore-keys let an older cache warm-start a new key.
          key: stim-cli-buildcache-ios-${{ matrix.framework }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            stim-cli-buildcache-ios-${{ matrix.framework }}-

      # Any restored content -- exact key or restore-keys prefix -- means the first
      # build may be a legitimate cross-run HIT rather than a cold miss. The
      # combined cache action only reports exact matches, so ask the filesystem.
      - name: Detect a warmed cross-run cache
        if: matrix.suite == 'loop'
        run: echo "STIM_E2E_WARM_CACHE=$([ -n \"$(ls -A \"$STIM_BUILD_CACHE\" 2>/dev/null)\" ] && echo 1 || echo 0)" >> "$GITHUB_ENV"

      - name: Loop suite (ios, ${{ matrix.framework }})
        if: matrix.suite == 'loop'
        # --keep leaves the temp worktrees in place on this ephemeral runner so
        # the artifact step below can collect their build logs.
        run: node test/e2e/native/run-native-e2e.mjs --framework ${{ matrix.framework }} --platform ios --keep --home "$TMPDIR/stim-cli-home"

      - name: Cache suite (ios, ${{ matrix.framework }})
        if: matrix.suite == 'caches'
        # It forces its own STIM_BUILD_CACHE / STIM_METRO_CACHE under a
        # throwaway home ON PURPOSE (see the file header): every number it
        # reports is a before/after around a COLD compile, and the persisted
        # cross-run cache above would turn each of them into a measurement of
        # nothing. Cache-suite jobs skip the cross-run cache restore.
        # --summary writes the machine-readable verdict where the artifact step
        # can pick it up whether the run passed or failed.
        run: >-
          node test/e2e/native/run-cache-e2e.mjs
          --framework ${{ matrix.framework }} --platform ios --keep --home "$TMPDIR/stim-cli-cache-home"
          --summary "$GITHUB_WORKSPACE/cache-summary-ios-${{ matrix.framework }}.json"

      - name: Upload the cache-suite summary
        # `always()`: a FAILING cache run is exactly when the per-check evidence
        # is worth reading, and the summary carries it.
        if: always() && matrix.suite == 'caches'
        uses: actions/upload-artifact@v4
        with:
          name: cache-summary-ios-${{ matrix.framework }}
          path: cache-summary-ios-${{ matrix.framework }}.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-ios-${{ matrix.framework }}-${{ matrix.suite }}
          path: |
            ${{ env.TMPDIR }}/stim-cli-home/workspaces/**/logs/*
            ${{ env.TMPDIR }}/stim-cli-cache-home/workspaces/**/logs/*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  android:
    name: android ${{ matrix.framework }} (${{ matrix.suite }})
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e-native'))
    # A Linux host with KVM: the Android emulator needs hardware acceleration,
    # which the ubuntu-latest GitHub runners provide once /dev/kvm is exposed.
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.suite == 'caches' && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        framework: [bare, expo]
        # Schedule and pull_request events have no suite input and use loop.
        suite: ${{ fromJSON(inputs.suite == 'all' && '["loop","caches"]' || inputs.suite == 'caches' && '["caches"]' || '["loop"]') }}
    env:
      STIM_E2E_SUITE: ${{ matrix.suite }}
      STIM_BUILD_CACHE: ${{ github.workspace }}/.e2e-build-cache/android-${{ matrix.framework }}
      TMPDIR: ${{ github.workspace }}/.e2e-tmp
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p "$TMPDIR" "$STIM_BUILD_CACHE"

      - name: Set up pnpm and Node 22
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Set up JDK 17
        # gradle for a modern RN/Expo Android build needs a JDK; 17 is the
        # current baseline.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install (workspace root)
        run: pnpm install --frozen-lockfile

      - name: Build (dist/cli.mjs is what the native e2e drives)
        run: pnpm run build

      - name: Restore cross-run build cache
        if: matrix.suite == 'loop'
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STIM_BUILD_CACHE }}
          key: stim-cli-buildcache-android-${{ matrix.framework }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            stim-cli-buildcache-android-${{ matrix.framework }}-

      # Expose /dev/kvm to the emulator (the standard incantation the
      # android-emulator-runner README recommends).
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Detect a warmed cross-run cache
        if: matrix.suite == 'loop'
        run: echo "STIM_E2E_WARM_CACHE=$([ -n \"$(ls -A \"$STIM_BUILD_CACHE\" 2>/dev/null)\" ] && echo 1 || echo 0)" >> "$GITHUB_ENV"

      - name: Native e2e (android, ${{ matrix.framework }}) -- runs the selected suite(s)
        # reactivecircus/android-emulator-runner installs the SDK + system image,
        # enables acceleration, and runs `script` once an emulator is up. stim-cli
        # then creates and boots its OWN owned AVD (the ownership rule forbids it
        # from touching a device it did not create -- see CLAUDE.md item 2), so
        # the action's emulator is only there to guarantee the SDK/KVM
        # environment; stim-cli does the device work itself.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # A fast, headless boot; the assertions do not need a window.
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          # The action's own emulator only proved the SDK/KVM environment; kill it
          # before the driver runs so stim-cli's owned emulator gets the runner's
          # full memory and CPU (two emulators on a 7 GB runner starve the boot).
          script: |
            adb -s emulator-5554 emu kill || true
            sleep 3
            if [ "$STIM_E2E_SUITE" = loop ]; then node test/e2e/native/run-native-e2e.mjs --framework ${{ matrix.framework }} --platform android --keep --home "$TMPDIR/stim-cli-home"; fi
            if [ "$STIM_E2E_SUITE" = caches ]; then node test/e2e/native/run-cache-e2e.mjs --framework ${{ matrix.framework }} --platform android --keep --home "$TMPDIR/stim-cli-cache-home" --summary "$GITHUB_WORKSPACE/cache-summary-android-${{ matrix.framework }}.json"; fi

      - name: Upload the cache-suite summary
        if: always() && matrix.suite == 'caches'
        uses: actions/upload-artifact@v4
        with:
          name: cache-summary-android-${{ matrix.framework }}
          path: cache-summary-android-${{ matrix.framework }}.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-android-${{ matrix.framework }}-${{ matrix.suite }}
          path: |
            ${{ env.TMPDIR }}/stim-cli-home/workspaces/**/logs/*
            ${{ env.TMPDIR }}/stim-cli-cache-home/workspaces/**/logs/*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
