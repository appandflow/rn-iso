# Fast, BLOCKING CI. Runs on every push and pull request.
#
# It does everything that is provable on a plain Linux box with no Xcode and no
# Android SDK: the full unit suite for all three workspace packages, and the
# fast cross-platform e2e (test/e2e/cache-flow.e2e.js), which drives the real
# CLI and the real cache library end to end with no compiler. The SLOW native
# builds (a real xcodebuild / gradle on a real device) live in e2e-native.yml,
# which is gated so a flaky 15-minute build never blocks a PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref: a new push cancels the previous run for the same
# branch/PR rather than piling up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Prove the engines floor. package.json declares "node": ">=20", so 20 is
      # the contract and 22 is the current LTS the maintainer runs; both must be
      # green. fail-fast off so a break on one version still shows the other.
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm ci from the workspace root installs every package deterministically
      # from package-lock.json. It is what the whole matrix hangs on, so it runs
      # first and blocks.
      - name: Install (workspace root)
        run: npm ci

      # The unit suite: rn-iso, then @rn-iso/expo-build-cache, then @rn-iso/metro
      # (the root `test` script chains all three).
      - name: Unit tests (all packages)
        run: npm test

      # The fast cross-platform e2e: real git worktrees, the real worktree
      # create/remove CLI, the real fingerprint/buildCacheKey/store/resolve cache
      # machinery, and a real single-flight race between real node processes --
      # all with a throwaway RN_ISO_HOME, no Xcode, no Android SDK.
      - name: Cross-platform e2e
        run: npm run test:e2e

      # PLACEHOLDER (planned TS migration): once the codebase moves to
      # TypeScript, add the lint + typecheck steps here, e.g.
      #   - run: npx oxlint
      #   - run: npx tsc --noEmit
      # They are intentionally NOT added now: neither oxlint nor a tsconfig is set
      # up in this repo yet, and a CI step that shells out to a tool that does not
      # exist would fail every run. Add them WITH the migration, not before it.
