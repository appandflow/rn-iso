# Fast, BLOCKING CI. Runs on every push and pull request.
#
# Everything provable on a plain Linux box with no Xcode and no Android SDK:
# lint, format, typecheck, build, the full vitest unit suite (all three
# packages), and the fast cross-platform e2e (test/e2e/cache-flow.e2e.js), which
# drives the real CLI and the real cache library end to end with no compiler.
# The SLOW native builds live in e2e-native.yml, gated so a flaky 15-minute
# build never blocks a PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # The engines floor is Node 22 (Node 20 is EOL). Prove 22 and the current
      # LTS line 24. fail-fast off so a break on one still shows the other.
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install (workspace root)
        run: npm ci

      # Lint / format / types are fast and fail early. oxlint and oxfmt are the
      # oxc toolchain; typecheck is the production src (tests run under vitest).
      - name: Lint (oxlint)
        run: npm run lint

      - name: Format check (oxfmt)
        run: npm run format:check

      - name: Typecheck (production)
        run: npm run typecheck

      # Dead-code gate: unused exports, files, and dependencies. Keeps the
      # surface honest as the codebase changes.
      - name: Dead code (knip)
        run: npm run knip

      # Build every package with tsdown (rn-iso -> dist ESM, the two cache
      # packages -> dist CJS). Proves the published artifacts compile.
      - name: Build (tsdown, all packages)
        run: npm run build

      # The unit suite on vitest (rolldown-vite): rn-iso + both cache packages,
      # 52 files. Real processes, real ports, real git; fakes for xcrun/adb.
      - name: Unit tests (vitest)
        run: npm test

      # The fast cross-platform e2e: real git worktrees, the real CLI, the real
      # fingerprint/buildCacheKey/store/resolve cache machinery, and a real
      # single-flight race between real node processes -- throwaway RN_ISO_HOME,
      # no Xcode, no Android SDK.
      - name: Cross-platform e2e
        run: npm run test:e2e
