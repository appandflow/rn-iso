# Fast, BLOCKING CI. Runs on every push and pull request.
#
# Everything provable on a plain Linux box with no Xcode and no Android SDK:
# lint, format, typecheck, build, the full vitest unit suite (all four
# packages), and the fast cross-platform e2e (test/e2e/cache-flow.e2e.js), which
# drives the real CLI and the real cache library end to end with no compiler.
# The SLOW native builds live in e2e-native.yml, gated so a flaky 15-minute
# build never blocks a PR.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Repository builds require Node 22.18 or later because tsdown uses that
      # floor. Prove Node 22 and the current LTS line 24.
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install (workspace root)
        run: pnpm install --frozen-lockfile

      # Lint and format are fast and fail early. oxlint and oxfmt are the oxc
      # toolchain; typecheck is the production src (tests run under vitest),
      # and it now sits below the build -- see why on that step.
      - name: Lint (oxlint)
        run: pnpm run lint

      - name: Format check (oxfmt)
        run: pnpm run format:check

      # Build every package with tsdown as ESM. Proves the published artifacts
      # compile.
      #
      # BEFORE typecheck, and that order is load-bearing. The cache packages
      # are consumed by stim-cli's suite as `@stim-cli/expo-build-cache` and
      # `@stim-cli/metro`; their declaration files are
      # build OUTPUT, so a typecheck that runs first cannot resolve either
      # module and fails with TS2307 on a tree that is perfectly fine.
      - name: Build (tsdown, all packages)
        run: pnpm run build

      - name: Typecheck (production)
        run: pnpm run typecheck

      # Dead-code gate: unused exports, files, and dependencies. Keeps the
      # surface honest as the codebase changes.
      - name: Dead code (knip)
        run: pnpm run knip

      # The unit suite on vitest (rolldown-vite): stim-cli + both cache packages,
      # 52 files. Real processes, real ports, real git; fakes for xcrun/adb.
      - name: Unit tests (vitest)
        run: pnpm test

      # The fast cross-platform e2e: real git worktrees, the real CLI, the real
      # fingerprint/buildCacheKey/store/resolve cache machinery, and a real
      # single-flight race between real node processes -- throwaway STIM_CLI_HOME,
      # no Xcode, no Android SDK.
      - name: Cross-platform e2e
        run: pnpm run test:e2e

  runtime-floor:
    name: published runtime (node 20.19.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up build Node
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install and build
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Set up runtime Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4

      - name: Verify published runtime
        run: node test/runtime-floor.mjs
